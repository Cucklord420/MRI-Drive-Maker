[package]
name = "mri-manifest"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
walkdir = "2"
regex = "1"

[dev-dependencies]
tempfile = "3"
