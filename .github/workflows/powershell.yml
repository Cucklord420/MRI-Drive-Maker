name: PowerShell startup and safety checks

on:
  push:
    paths:
      - '**/*.ps1'
      - '**/*.psm1'
      - '**/*.cs'
      - '**/*.cmd'
      - 'mri-config.example.json'
      - 'scripts/Build-Download.py'
      - 'downloads/MRI-Drive-Maker-v*.zip'
      - '.github/workflows/powershell.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out the tested source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test Windows PowerShell launcher, menus, and simulated builds
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) {
            throw 'This job must run Windows PowerShell 5.1.'
          }
          & ./tests/StartupSmoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify explicit USB selection and erase-list confirmation
        shell: powershell
        run: |
          & ./tests/SelectionSmoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native process completion and cancellation
        shell: powershell
        run: |
          & ./tests/WindowsProcessSmoke.ps1
          if (-not $?) { exit 1 }
      - name: Verify source archives and input validation
        shell: powershell
        run: |
          & ./tests/SourceSmoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify ISO mounting and the real storage backend on an owned VHD
        shell: powershell
        run: |
          & ./tests/WindowsStorageSmoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify concurrent FAT32 preparation and copying without drive letters
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          & ./tests/WindowsConcurrencySmoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and verify the source download and its actual launcher
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          $archive=Join-Path $env:RUNNER_TEMP 'MRI-Drive-Maker-candidate.zip'
          python ./scripts/Build-Download.py --output $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./tests/PackageSmoke.ps1 -ArchivePath $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $published='./downloads/MRI-Drive-Maker-v0.3.0.zip'
          if (Test-Path -LiteralPath $published) {
            python ./scripts/Build-Download.py --verify $published
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & ./tests/PackageSmoke.ps1 -ArchivePath $published
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
