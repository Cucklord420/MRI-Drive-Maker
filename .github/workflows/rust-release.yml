name: Rust MRI release packaging and integrity
on:
  push:
    paths:
      - 'rust-toolchain.toml'
      - 'rust/mri-release/**'
      - 'tests/PackageSmoke.ps1'
      - '.github/workflows/rust-release.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs per event; keep push and pull_request checks independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}-${{ (github.event_name == 'workflow_dispatch' || github.run_attempt != '1') && github.run_id || 'automatic' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.run_attempt == '1' }}

jobs:
  rust-release-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full committed-source history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/mri-release/Cargo.toml -- --check
      - name: Lint Rust release implementation and adversarial tests
        run: cargo clippy --locked --manifest-path rust/mri-release/Cargo.toml --all-targets -- -D warnings
      - name: Rust release integrity tests in debug and release profiles
        run: cargo test --locked --manifest-path rust/mri-release/Cargo.toml
      - name: Run Rust release integrity tests with optimizations enabled
        run: cargo test --release --locked --manifest-path rust/mri-release/Cargo.toml
  windows-release-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verified release sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Windows Rust format and lint components
        shell: pwsh
        run: rustup component add rustfmt clippy
      - name: Check Rust formatting
        shell: pwsh
        run: |
          cargo fmt --manifest-path rust/mri-release/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Enforce strict Windows Rust release lints
        shell: pwsh
        run: |
          cargo clippy --locked --manifest-path rust/mri-release/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Rust release integrity tests in debug and release profiles
        shell: pwsh
        run: |
          cargo test --locked --manifest-path rust/mri-release/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release --locked --manifest-path rust/mri-release/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Produce and verify native Rust release candidate
        shell: pwsh
        run: |
          $archive=Join-Path $env:RUNNER_TEMP 'MRI-Rust-candidate.zip'
          cargo run --release --locked --manifest-path rust/mri-release/Cargo.toml -- --output $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --release --locked --manifest-path rust/mri-release/Cargo.toml -- --verify $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RUST_RELEASE_CANDIDATE=$archive" >> $env:GITHUB_ENV
      - name: Test extracted Rust-built package and actual Windows launcher
        shell: powershell
        run: |
          & ./tests/PackageSmoke.ps1 -ArchivePath $env:RUST_RELEASE_CANDIDATE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  publish-v031:
    name: Publish MRI Drive Maker v0.3.1 after verified main merge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release(mri): publish v0.3.1')
    needs: [rust-release-verification, windows-release-smoke]
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out exact merged release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build, verify and exercise versioned release archive
        shell: pwsh
        run: |
          $actualHead = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualHead -ne $env:GITHUB_SHA) { throw 'Checkout does not match the merged release commit.' }
          $archive = Join-Path $env:RUNNER_TEMP 'MRI-Drive-Maker-v0.3.1.zip'
          cargo run --release --locked --manifest-path rust/mri-release/Cargo.toml -- --version 0.3.1 --output $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --release --locked --manifest-path rust/mri-release/Cargo.toml -- --verify $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./tests/PackageSmoke.ps1 -ArchivePath $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = Join-Path $env:RUNNER_TEMP 'MRI-Drive-Maker-v0.3.1.zip.sha256'
          [IO.File]::WriteAllText($checksum, "$hash  MRI-Drive-Maker-v0.3.1.zip`n", [Text.UTF8Encoding]::new($false))
          "RELEASE_ARCHIVE=$archive" >> $env:GITHUB_ENV
          "RELEASE_CHECKSUM=$checksum" >> $env:GITHUB_ENV
          "RELEASE_HASH=$hash" >> $env:GITHUB_ENV
          Write-Host "Verified v0.3.1 candidate SHA256: $hash"
      - name: Publish GitHub Release and verify downloaded asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          ## Serial-less Kanguru USB support
          - Menu 2 supports one-time manual preparation of Kanguru FLASHBLU and other eligible USBs reporting serial 0, when Windows provides distinct connection identities.
          - The erase operation still requires explicit disk-number selection and the displayed ERASE confirmation. Boot, system, source, and application disks remain excluded.
          - The continuous registered-drive watcher still requires unique hardware serials.

          **Use:** Download and extract MRI-Drive-Maker-v0.3.1.zip, then right-click START-MRI-DRIVE-MAKER.cmd and choose Run as administrator. Choose menu 1 for your authorized MRI files, then menu 2 to select target USBs. Keep selected USBs connected throughout the operation.

          **Testing:** Rust formatting, strict Clippy, release integrity tests, Windows PowerShell selection/safety tests and packaged-launcher smoke tests run in GitHub Actions. No physical Kanguru drives, MRI firmware boot or proprietary MRI payload have been validated. A Windows connection ID is not a permanent hardware serial. Do not swap or move the USBs during preparation.

          Fix: https://github.com/Cucklord420/MRI-Drive-Maker/pull/92
          Hardware acceptance remains open: https://github.com/Cucklord420/MRI-Drive-Maker/issues/85
          '@
          gh release create v0.3.1 "$env:RELEASE_ARCHIVE" "$env:RELEASE_CHECKSUM" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title 'MRI Drive Maker v0.3.1' --notes $notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = gh release view v0.3.1 --repo "$env:GITHUB_REPOSITORY" --json tagName,isDraft,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.tagName -ne 'v0.3.1' -or $release.isDraft) { throw 'Published release readback failed.' }
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          if ('MRI-Drive-Maker-v0.3.1.zip' -notin $assetNames -or 'MRI-Drive-Maker-v0.3.1.zip.sha256' -notin $assetNames) {
            throw 'Published release is missing the ZIP or checksum.'
          }
          $tagSha = (gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/v0.3.1" --jq '.object.sha').Trim()
          if ($LASTEXITCODE -ne 0 -or $tagSha -ne $env:GITHUB_SHA) { throw 'Published release tag points to an unexpected commit.' }
          $verificationDir = Join-Path $env:RUNNER_TEMP 'mri-v031-readback'
          [void][IO.Directory]::CreateDirectory($verificationDir)
          gh release download v0.3.1 --repo "$env:GITHUB_REPOSITORY" --pattern 'MRI-Drive-Maker-v0.3.1.zip' --dir $verificationDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $downloaded = Join-Path $verificationDir 'MRI-Drive-Maker-v0.3.1.zip'
          $downloadHash = (Get-FileHash -LiteralPath $downloaded -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($downloadHash -ne $env:RELEASE_HASH) { throw 'Published ZIP differs from the tested release candidate.' }
          Write-Host "Verified published release v0.3.1 at commit $tagSha SHA256 $downloadHash"
