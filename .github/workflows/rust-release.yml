name: Rust MRI release packaging and original-Python parity
on:
  push:
    paths:
      - 'rust/mri-release/**'
      - 'scripts/Build-Download.py'
      - 'tests/PackageSmoke.ps1'
      - '.github/workflows/rust-release.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-release-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full committed-source history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust format and lint components
        run: rustup component add rustfmt clippy
      - name: Verify Rust release formatting
        run: cargo fmt --manifest-path rust/mri-release/Cargo.toml -- --check
      - name: Enforce strict Rust release lints
        run: cargo clippy --manifest-path rust/mri-release/Cargo.toml --all-targets -- -D warnings
      - name: Rust release build and original Python differential tests
        run: cargo test --manifest-path rust/mri-release/Cargo.toml
  windows-release-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verified release sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Configure original Python interpreter for differential ZIP bytes
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Verify byte-for-byte original Python ZIP parity on Windows
        shell: pwsh
        run: |
          cargo test --manifest-path rust/mri-release/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Produce and verify native Rust release candidate
        shell: pwsh
        run: |
          $archive=Join-Path $env:RUNNER_TEMP 'MRI-Rust-candidate.zip'
          cargo run --manifest-path rust/mri-release/Cargo.toml -- --output $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --manifest-path rust/mri-release/Cargo.toml -- --verify $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RUST_RELEASE_CANDIDATE=$archive" >> $env:GITHUB_ENV
      - name: Test extracted Rust-built package and actual Windows launcher
        shell: powershell
        run: |
          & ./tests/PackageSmoke.ps1 -ArchivePath $env:RUST_RELEASE_CANDIDATE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
