name: Rust MRI release packaging and integrity
on:
  push:
    paths:
      - 'rust-toolchain.toml'
      - 'rust/mri-release/**'
      - 'tests/PackageSmoke.ps1'
      - '.github/workflows/rust-release.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs per event; keep push and pull_request checks independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}-${{ (github.event_name == 'workflow_dispatch' || github.run_attempt != '1') && github.run_id || 'automatic' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.run_attempt == '1' }}

jobs:
  rust-release-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full committed-source history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/mri-release/Cargo.toml -- --check
      - name: Lint Rust release implementation and adversarial tests
        run: cargo clippy --locked --manifest-path rust/mri-release/Cargo.toml --all-targets -- -D warnings
      - name: Rust release integrity tests in debug and release profiles
        run: cargo test --locked --manifest-path rust/mri-release/Cargo.toml
      - name: Run Rust release integrity tests with optimizations enabled
        run: cargo test --release --locked --manifest-path rust/mri-release/Cargo.toml
  windows-release-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verified release sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Windows Rust format and lint components
        shell: pwsh
        run: rustup component add rustfmt clippy
      - name: Check Rust formatting
        shell: pwsh
        run: |
          cargo fmt --manifest-path rust/mri-release/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Enforce strict Windows Rust release lints
        shell: pwsh
        run: |
          cargo clippy --locked --manifest-path rust/mri-release/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Rust release integrity tests in debug and release profiles
        shell: pwsh
        run: |
          cargo test --locked --manifest-path rust/mri-release/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release --locked --manifest-path rust/mri-release/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Produce and verify native Rust release candidate
        shell: pwsh
        run: |
          $archive=Join-Path $env:RUNNER_TEMP 'MRI-Rust-candidate.zip'
          cargo run --release --locked --manifest-path rust/mri-release/Cargo.toml -- --output $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --release --locked --manifest-path rust/mri-release/Cargo.toml -- --verify $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RUST_RELEASE_CANDIDATE=$archive" >> $env:GITHUB_ENV
      - name: Test extracted Rust-built package and actual Windows launcher
        shell: powershell
        run: |
          & ./tests/PackageSmoke.ps1 -ArchivePath $env:RUST_RELEASE_CANDIDATE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
