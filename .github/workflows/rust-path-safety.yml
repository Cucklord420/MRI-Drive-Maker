name: Rust MRI safe relative paths (Windows parity)
on:
  push:
    paths:
      - 'rust/mri-path-safety/**'
      - 'MRI.Batch.psm1'
      - 'tests/RustPathParity.ps1'
      - '.github/workflows/rust-path-safety.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relative-path-policy:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust format and lint components
        run: rustup component add rustfmt clippy
      - name: Verify Rust path policy formatting
        run: cargo fmt --manifest-path rust/mri-path-safety/Cargo.toml -- --check
      - name: Enforce strict Rust path policy lints
        run: cargo clippy --manifest-path rust/mri-path-safety/Cargo.toml --all-targets -- -D warnings
      - name: Run Rust positive, negative and 200-mutant self-tests
        run: cargo test --manifest-path rust/mri-path-safety/Cargo.toml
      - name: Build read-only Rust path normalizer
        run: cargo build --manifest-path rust/mri-path-safety/Cargo.toml
      - name: Verify 635 Windows PowerShell differential cases
        shell: powershell
        run: ./tests/RustPathParity.ps1
