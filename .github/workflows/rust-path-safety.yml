name: Rust MRI safe relative paths (Windows parity)
on:
  push:
    paths:
      - 'rust/mri-path-safety/**'
      - 'MRI.Batch.psm1'
      - 'tests/RustPathParity.ps1'
      - '.github/workflows/rust-path-safety.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Coalesce branch pushes and PR checks; never let outdated runs bury final-head checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'automatic' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  relative-path-policy:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run Rust positive, negative and 200-mutant self-tests
        run: cargo test --manifest-path rust/mri-path-safety/Cargo.toml
      - name: Build read-only Rust path normalizer
        run: cargo build --manifest-path rust/mri-path-safety/Cargo.toml
      - name: Verify 635 Windows PowerShell differential cases
        shell: powershell
        run: ./tests/RustPathParity.ps1
