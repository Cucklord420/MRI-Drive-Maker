name: Rust USB selection safety (offline parity)
on:
  push:
    paths:
      - 'rust/mri-safety/**'
      - 'MRI.Batch.psm1'
      - 'tests/RustSelectionParity.ps1'
      - 'tests/RustHardwareIdentityParity.ps1'
      - '.github/workflows/rust-safety.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs per event; keep push and pull_request checks independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}-${{ (github.event_name == 'workflow_dispatch' || github.run_attempt != '1') && github.run_id || 'automatic' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.run_attempt == '1' }}

jobs:
  rust-selection:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Rust unit and 100-case policy self-tests
        run: cargo test --manifest-path rust/mri-safety/Cargo.toml
      - name: Build isolated read-only selection executable
        run: cargo build --manifest-path rust/mri-safety/Cargo.toml
      - name: Compare Rust to original PowerShell with disposable inventories
        shell: powershell
        run: ./tests/RustSelectionParity.ps1
      - name: Compare Rust hardware identity to original PowerShell across 113 fixtures
        shell: powershell
        run: ./tests/RustHardwareIdentityParity.ps1
