name: Rust MRI manifest versus original PowerShell parity
on:
  push:
    paths:
      - 'rust/mri-manifest/**'
      - 'MRI.Batch.psm1'
      - 'tests/RustManifestParity.ps1'
      - 'tests/RustManifestMatchParity.ps1'
      - 'tests/RustContentsSafeParity.ps1'
      - '.github/workflows/rust-manifest.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-media-manifest:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout actual original Windows PowerShell and Rust sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run Rust source-tree manifest self tests
        run: cargo test --manifest-path rust/mri-manifest/Cargo.toml
      - name: Require canonical Rust formatting
        run: cargo fmt --manifest-path rust/mri-manifest/Cargo.toml -- --check
      - name: Require strict Rust lint checks
        run: cargo clippy --manifest-path rust/mri-manifest/Cargo.toml --all-targets -- -D warnings
      - name: Build read-only Rust manifest CLI
        run: cargo build --manifest-path rust/mri-manifest/Cargo.toml
      - name: Compare 400 synthetic manifests with real Get-MRIManifest
        shell: powershell
        run: ./tests/RustManifestParity.ps1
      - name: Compare 600 final-manifest match decisions with real Assert-MRIManifestMatch
        shell: powershell
        run: ./tests/RustManifestMatchParity.ps1
      - name: Compare 780 existing-media receipt safety decisions with original PowerShell
        shell: powershell
        run: ./tests/RustContentsSafeParity.ps1
